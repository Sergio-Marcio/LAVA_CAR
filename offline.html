<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0284c7">
  <title>LAVA_CAR Pro - Offline</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-full flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-3">
    <h1 class="text-lg font-extrabold">Você está offline</h1>
    <p class="text-sm text-slate-600">Algumas funções podem não estar disponíveis sem internet (login e sincronização com a nuvem).</p>
    <button onclick="location.reload()" class="touch-target w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg shadow-brand-500/20 transition">Tentar novamente</button>
  </div>
</body>
</html>
